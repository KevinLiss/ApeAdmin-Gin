# GinApeAdmin 配置文件
# 环境变量覆盖示例：GA_DATABASE_TYPE=mysql 覆盖 database.type

app:
  name: "GinApeAdmin"
  version: "0.2.0"
  debug: true
  api_prefix: "/api/v1"
  admin_path: "/admin"
  spa_dir: "frontend/dist"      # 前端构建产物目录（SPA 静态服务）
  port: 8001                    # HTTP 监听端口

database:
  type: sqlite              # sqlite | mysql
  host: localhost
  port: 3306
  user: root
  password: ""
  dbname: gin_apeadmin
  max_open_conns: 50
  max_idle_conns: 10
  log_level: warn           # silent | error | warn | info
  auto_migrate: true        # 仅开发/首启用；生产必须 false 并走 golang-migrate（见 14.5）

redis:
  url: "redis://localhost:6379/1"
  enabled: false            # 默认关闭，按需开启

jwt:
  secret: "change-me-in-production-please-32chars!"
  algorithm: "HS256"
  expire_minutes: 1440      # access token 24h
  refresh_expire_days: 7    # refresh token 7d
  blacklist_enabled: true   # 登出/改密即失效；多实例部署需配合 redis.enabled=true

cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:8000"

mcp:
  enabled: true
  prefix: "/mcp"
  timeout: 30               # 单次工具调用超时（秒）
  max_concurrency: 10       # 单工具并发上限（信号量）

plugin:
  enabled: true
  builtin_dir: "internal/plugin/builtin"
  upload_dir: "uploads/plugins"
  zip_guard:                       # ZIP 安全校验（见 14.3）
    max_zip_size_mb: 50            # 压缩包大小上限
    max_decompressed_mb: 200       # 解压后总量上限（防 zip bomb）
    max_entries: 2000              # 条目数上限
    deny_symlinks: true            # 拒绝符号链接条目

file:
  storage_dir: "uploads/files"
  max_size_mb: 100

super_admin:
  username: "admin"
  password: "admin123"

pagination:
  default_page_size: 20
  max_page_size: 100

security:
  login_guard:                  # 登录防爆破（见 14.1）
    max_attempts: 5             # 窗口内最大失败次数
    window_minutes: 15
    lock_minutes: 30
  rate_limit:                   # API 限流（见 14.2）
    enabled: true
    requests_per_minute: 300    # 每 IP 每分钟
    burst: 50
  upload:                       # 文件上传校验（见 14.4）
    allowed_exts: [.jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip]

log:
  level: info               # debug | info | warn | error
  format: json              # json | console
  output: stdout            # stdout | file
  file_path: "logs/app.log"
  op_log_queue_size: 1024   # 操作日志缓冲队列容量（0 = 同步写）
